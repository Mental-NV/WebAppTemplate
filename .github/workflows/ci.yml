name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      Google__ClientId: ci-test.apps.googleusercontent.com
      Jwt__SigningKey: ci_test_signing_key_32_chars_minimum_123456
      VITE_GOOGLE_CLIENT_ID: ci-test.apps.googleusercontent.com
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Build
        run: ./scripts/build.ps1 -Configuration Release -CI

      - name: CI checks
        run: ./scripts/ci.ps1 -Configuration Release -CI

      - name: Publish
        run: ./scripts/publish.ps1 -Configuration Release -CI

      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        working-directory: src/web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browsers (Windows)
        if: runner.os == 'Windows'
        working-directory: src/web
        run: npx playwright install chromium

      - name: Run Playwright E2E
        env:
          Jwt__SigningKey: ${{ secrets.JWT__SIGNINGKEY }}
          HTTPS_CERT_PFX_BASE64: ${{ secrets.HTTPS_CERT_PFX_BASE64 }}
          HTTPS_CERT_PASSWORD: ${{ secrets.HTTPS_CERT_PASSWORD }}
          E2E_AUTH_SECRET: ci-e2e-secret
        working-directory: src/web
        run: npx playwright test --project=chromium
