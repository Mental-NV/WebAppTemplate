name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      Google__ClientId: ci-test.apps.googleusercontent.com
      Jwt__SigningKey: ci_test_signing_key_32_chars_minimum_123456
      VITE_GOOGLE_CLIENT_ID: ci-test.apps.googleusercontent.com
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Build
        run: ./scripts/build.ps1 -Configuration Release -CI

      - name: CI checks
        run: ./scripts/ci.ps1 -Configuration Release -CI

      - name: Publish
        run: ./scripts/publish.ps1 -Configuration Release -CI

      - name: Run HTTPS smoke test
        env:
          Google__ClientId: ${{ secrets.GOOGLE__CLIENTID }}
          Jwt__SigningKey: ${{ secrets.JWT__SIGNINGKEY }}
          HTTPS_CERT_PFX_BASE64: ${{ secrets.HTTPS_CERT_PFX_BASE64 }}
          HTTPS_CERT_PASSWORD: ${{ secrets.HTTPS_CERT_PASSWORD }}
        run: |
          $artifactDir = Join-Path -Path $PWD -ChildPath "artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $stdoutLog = Join-Path -Path $artifactDir -ChildPath "run-smoke.stdout.log"
          $stderrLog = Join-Path -Path $artifactDir -ChildPath "run-smoke.stderr.log"
          $proc = $null
          $uri = "https://localhost:5001/"

          try {
            $proc = Start-Process `
              -FilePath "pwsh" `
              -ArgumentList @(
                "-NoLogo",
                "-NoProfile",
                "-File", "./scripts/run.ps1",
                "-PublishOutputDir", "artifacts/publish/app",
                "-CI"
              ) `
              -WorkingDirectory $PWD `
              -PassThru `
              -RedirectStandardOutput $stdoutLog `
              -RedirectStandardError $stderrLog

            $isReady = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              if ($proc.HasExited) {
                break
              }

              try {
                $response = Invoke-WebRequest -Uri $uri -SkipCertificateCheck -TimeoutSec 5
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 400) {
                  $isReady = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 2
              }
            }

            if (-not $isReady) {
              if ($null -ne $proc -and $proc.HasExited) {
                Write-Host "run.ps1 exited early with code $($proc.ExitCode)." -ForegroundColor Red
              }

              if (Test-Path -LiteralPath $stdoutLog) {
                Write-Host "`n--- run smoke stdout ---"
                Get-Content -LiteralPath $stdoutLog
              }
              if (Test-Path -LiteralPath $stderrLog) {
                Write-Host "`n--- run smoke stderr ---"
                Get-Content -LiteralPath $stderrLog
              }

              throw "HTTPS smoke test failed: $uri"
            }

            Write-Host "HTTPS smoke test passed: $uri" -ForegroundColor Green
          }
          finally {
            if ($null -ne $proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
